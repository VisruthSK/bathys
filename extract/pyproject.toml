[project]
name = "bathys-build"
version = "1.0.0"
license = "OFL-1.1"
description = "Outline sources, OpenType compiler and proofs for Bathys"
requires-python = ">=3.13"
dependencies = [
    "brotli==1.2.1",
    "fonttools==4.68.0",
    "skia-pathops==0.9.2",
    "uharfbuzz==0.57.0",
]

[dependency-groups]
dev = ["playwright==1.64.1", "ruff==0.17.4"]
trace = ["pillow==13.0.0", "potracer==0.0.4"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
cache-dir = "generated/ruff-cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
